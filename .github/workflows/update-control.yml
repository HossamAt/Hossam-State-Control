name: Update Hossam State Control

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: "true = تشغيل / false = إغلاق"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

      message:
        description: "رسالة الإغلاق"
        required: true
        default: "التطبيق متوقف حاليًا. يرجى تحميل أحدث إصدار."

      version:
        description: "رقم إصدار التحكم"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  update-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update kill switch
        env:
          ENABLED: ${{ inputs.enabled }}
          MESSAGE: ${{ inputs.message }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os

          data = {
              "enabled": os.environ["ENABLED"].lower() == "true",
              "message": os.environ["MESSAGE"],
              "version": int(os.environ["VERSION"])
          }

          with open("kill_switch.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit changes
        run: |
          git config user.name "Hossam State Control"
          git config user.email "actions@users.noreply.github.com"

          git add kill_switch.json

          git diff --cached --quiet || git commit \
            -m "Update app control"

          git push
